server:
  port: 8084
spring:
  application:
    name: payment
  datasource:
    url: jdbc:mariadb://localhost:${DB_PORT:3307}/dbs
    username: ${DB_USER:dbs}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment
      auto-offset-reset: earliest
directory:
  url: http://localhost:8085
  timeout: PT2S
account:
  url: http://localhost:8082
payment:
  max-wait-ms: 30000
  step-up-over: "1000.00"
