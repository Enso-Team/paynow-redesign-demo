server:
  port: 8081
spring:
  application:
    name: auth
  datasource:
    url: jdbc:mariadb://localhost:${DB_PORT:3307}/dbs
    username: ${DB_USER:dbs}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
auth:
  otp: "123456"
  access-ttl: PT5M
  refresh-ttl: PT30M
  nonce-ttl: PT60S
  peek-ttl: PT60S
  attest-ttl: PT2M
  step-up-ttl: PT2M
